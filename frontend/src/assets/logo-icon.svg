<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#4f46e5"/>

  <!-- Circuit traces -->
  <line x1="50" y1="18" x2="50" y2="10" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="10" x2="38" y2="10" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="10" x2="62" y2="10" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <line x1="30" y1="68" x2="22" y2="68" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="68" x2="22" y2="80" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <line x1="70" y1="68" x2="78" y2="68" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="78" y1="68" x2="78" y2="80" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <line x1="33" y1="57" x2="24" y2="57" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="67" y1="57" x2="76" y2="57" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- The A -->
  <!-- Left leg -->
  <line x1="28" y1="80" x2="50" y2="18" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg -->
  <line x1="72" y1="80" x2="50" y2="18" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossbar -->
  <line x1="33" y1="57" x2="67" y2="57" stroke="white" stroke-width="7" stroke-linecap="round"/>

  <!-- Apex node -->
  <circle cx="50" cy="18" r="5.5" fill="#c7d2fe"/>
  <circle cx="50" cy="18" r="2.5" fill="white"/>

  <!-- Crossbar nodes -->
  <circle cx="33" cy="57" r="4.5" fill="#c7d2fe"/>
  <circle cx="67" cy="57" r="4.5" fill="#c7d2fe"/>

  <!-- Base nodes -->
  <circle cx="28" cy="80" r="3.5" fill="#818cf8"/>
  <circle cx="72" cy="80" r="3.5" fill="#818cf8"/>

  <!-- Tiny terminal nodes on traces -->
  <circle cx="38" cy="10" r="2" fill="#c7d2fe" opacity="0.8"/>
  <circle cx="62" cy="10" r="2" fill="#c7d2fe" opacity="0.8"/>
  <circle cx="22" cy="80" r="2" fill="#818cf8" opacity="0.7"/>
  <circle cx="78" cy="80" r="2" fill="#818cf8" opacity="0.7"/>
</svg>
